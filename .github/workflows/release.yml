name: Release plugin

# Push a tag like v1.0.0 to build the zip and attach it to a GitHub Release.
# The repo.json download links point at the release asset, so Dalamud can
# install/update the plugin from your custom repository URL.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud (API 14)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath dalamud

      - name: Build
        env:
          DALAMUD_HOME: ${{ github.workspace }}/dalamud
        run: dotnet build FriendListQoL/FriendListQoL.csproj -c Release

      - name: Zip plugin
        shell: pwsh
        run: |
          $zip = Get-ChildItem "FriendListQoL/bin/Release" -Recurse -Filter "latest.zip" | Select-Object -First 1
          Copy-Item $zip.FullName -Destination "FriendListQoL.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: FriendListQoL.zip
          generate_release_notes: true
